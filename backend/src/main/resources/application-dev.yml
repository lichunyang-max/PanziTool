# ============================================================================
# 开发环境配置（profile=dev）
# ----------------------------------------------------------------------------
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=dev
#           或设置环境变量 SPRING_PROFILES_ACTIVE=dev
# 需要本地 PostgreSQL：jdbc:postgresql://localhost:5432/panzipool
# ============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:7099/panzitooldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root@123!}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      # 表结构由 JPA 自动管理（已存在表保留，无表自动创建，新增字段自动追加）
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      # 开发环境展示健康详情
      show-details: always

panzipool:
  cors:
    # 开发环境允许 localhost（可多个，逗号分隔；5173 为资源站 Vue 项目 dev 端口）
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:8080}
  minio:
    # 本地 MinIO：API 端口默认 9000（控制台 9001）
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:DYGdyg123}
    bucket: ${MINIO_BUCKET:panzipool}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000/panzipool}
  upload:
    # 开发环境直接写入前端静态目录，Nuxt 即以 /images 路径即时提供访问；
    # 生产环境通过环境变量 UPLOAD_DIR 覆盖为 Nginx 站点目录
    dir: ${UPLOAD_DIR:../frontend/public}

logging:
  level:
    com.panzipool.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
