# ============================================================================
# 开发环境配置（profile=dev）
# ----------------------------------------------------------------------------
# 启动方式：mvn spring-boot:run -Dspring-boot.run.profiles=dev
#           或设置环境变量 SPRING_PROFILES_ACTIVE=dev
# 需要本地 PostgreSQL：jdbc:postgresql://localhost:5432/panzipool
# ============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:7099/panzitooldb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root@123!}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      # 表结构由 JPA 自动管理（已存在表保留，无表自动创建，新增字段自动追加）
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      # 开发环境展示健康详情
      show-details: always

panzipool:
  cors:
    # 开发环境允许 localhost（可多个，逗号分隔）
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

logging:
  level:
    com.panzipool.api: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
