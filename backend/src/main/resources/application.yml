# ============================================================================
# PanziPool 后端基础配置（默认 profile）
# ----------------------------------------------------------------------------
# 说明：默认 profile 使用 H2 内存数据库，便于在无外部 PostgreSQL 的环境下
# 一键启动验证（Tomcat 可达、Actuator/OpenAPI/Ping 可用）。
# dev/prod profile 会覆盖 datasource 为 PostgreSQL（见 application-dev.yml / application-prod.yml）。
# ============================================================================

server:
  port: 8080
  servlet:
    # 所有接口统一加 /api/v1 前缀；Controller 内 @RequestMapping 无需重复书写
    context-path: /api/v1

spring:
  application:
    name: panzipool-backend
  profiles:
    # 通过环境变量 SPRING_PROFILES_ACTIVE 切换 dev/prod；默认为空（使用 H2）
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    # 默认 H2 内存库 + PostgreSQL 兼容模式，无需外部依赖即可启动
    # DATABASE_TO_LOWER=TRUE：将未加引号的标识符折叠为小写，与 PostgreSQL 行为一致，
    # 确保 JPA ddl-auto=validate 在 H2 与 PostgreSQL 之间行为一致
    url: jdbc:h2:mem:panzipool;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # 由 Flyway 管理表结构，JPA 仅校验
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # 默认 profile 不显式指定 dialect，由 Hibernate 依据 H2 自动检测
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator 健康检查
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # 默认隐藏详情；dev 覆盖为 always
      show-details: when-authorized

# OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    # 配合 context-path=/api/v1，最终路径为 /api/v1/docs
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    # 最终路径为 /api/v1/docs-json
    path: /docs-json
  default-produces-media-type: application/json

# 自定义属性
panzipool:
  ratelimit:
    # 同一 anon_id 每分钟最大请求数
    anon-id-per-minute: 30
    # 同一 IP 每分钟最大请求数
    ip-per-minute: 60
  cors:
    # 允许的源（逗号分隔），可通过环境变量 CORS_ORIGINS 切换
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: true
    max-age: 3600

logging:
  level:
    com.panzipool.api: INFO
    org.hibernate.SQL: WARN
