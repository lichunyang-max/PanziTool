# ============================================================================
# 生产环境配置（profile=prod）
# ----------------------------------------------------------------------------
# 启动方式：SPRING_PROFILES_ACTIVE=prod
# 数据库连接已内置默认值，也可通过环境变量覆盖：
#   DB_URL / DB_USERNAME / DB_PASSWORD / CORS_ORIGINS
# ============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.110.234:5432/testdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:DYGdyg123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    show-sql: false
    hibernate:
      # 表结构由 JPA 自动管理（已存在表保留，无表自动创建，新增字段自动追加）
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      # 生产环境默认隐藏详情（除非授权）
      show-details: when-authorized

panzipool:
  cors:
    # 生产环境仅允许主站域名
    allowed-origins: ${CORS_ORIGINS:https://www.panzipool.com,http://localhost:3000,http://localhost:8080}

logging:
  level:
    com.panzipool.api: INFO
    org.hibernate.SQL: WARN
