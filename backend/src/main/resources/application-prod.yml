# ============================================================================
# 生产环境配置（profile=prod）
# ----------------------------------------------------------------------------
# 启动方式：SPRING_PROFILES_ACTIVE=prod
# 数据库连接已内置默认值，也可通过环境变量覆盖：
#   DB_URL / DB_USERNAME / DB_PASSWORD / CORS_ORIGINS
# ============================================================================

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/panzitooldb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:DYGdyg123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    show-sql: false
    hibernate:
      # 表结构由 JPA 自动管理（已存在表保留，无表自动创建，新增字段自动追加）
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoint:
    health:
      # 生产环境默认隐藏详情（除非授权）
      show-details: when-authorized

panzipool:
  cors:
    # 生产环境允许的源：主站 + 资源站域名（resource 前端经同域 Nginx 反代 API，此处用于直连场景）
    allowed-origins: ${CORS_ORIGINS:https://tool.panzipool.com,https://www.panzipool.com,https://resource.panzipool.com,http://localhost:3000,http://localhost:8080}
  minio:
    # 生产 MinIO：S3 API 端口 9002（9001 为控制台端口）
    # public-url 为经 Nginx 反代的公网地址（见 nginx resource 站配置 /minio/）
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:DYGdyg123}
    bucket: ${MINIO_BUCKET:panzipool}
    public-url: ${MINIO_PUBLIC_URL:https://resource.panzipool.com/minio/panzipool}

# 生产环境管理员配置：务必通过 ADMIN_PASSWORD_HASH 设置 BCrypt 哈希，并启用 Secure Cookie
admin:
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH:}
  session-timeout-minutes: 120
  secure-cookie: true

logging:
  level:
    com.panzipool.api: INFO
    org.hibernate.SQL: WARN
