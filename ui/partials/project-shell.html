<!-- PanziPool Shared Project Shell — gen-project-shell (v5 fixed layout)-->
<!-- Full-width header/footer fixed at top/bottom, sidebar between them. -->
<!-- Collapsed width: 36px. Accordion: first menu expanded by default.  -->
<!-- ================================================================= -->

<style>
  /* === Base layout: full-width header/footer, sidebar+main between === */
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    background-color: var(--pz-color-bg);
    color: var(--pz-color-text-primary);
    font-family: var(--pz-font-sans);
  }

  /* === Nav link styles === */
  .pz-nav-link {
    display: inline-flex;
    align-items: center;
    font-family: var(--pz-font-sans);
    font-size: var(--pz-text-sm);
    font-weight: var(--pz-weight-medium);
    color: var(--pz-color-text-secondary);
    padding: 0.5rem 0.75rem;
    border-radius: var(--pz-radius-md);
    transition: color 0.15s ease, background-color 0.15s ease;
    white-space: nowrap;
    text-decoration: none;
  }
  .pz-nav-link:hover {
    color: var(--pz-color-text-primary);
    background-color: var(--pz-color-bg-secondary);
  }
  .pz-nav-link:focus-visible {
    outline: 2px solid var(--pz-color-primary);
    outline-offset: 2px;
  }
  .pz-nav-link[data-active="true"] {
    color: var(--pz-color-primary);
    background-color: var(--pz-color-primary-light);
  }

  /* === Footer link styles === */
  .pz-footer-link {
    font-family: var(--pz-font-sans);
    font-size: var(--pz-text-sm);
    color: var(--pz-color-text-secondary);
    transition: color 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }
  .pz-footer-link:hover { color: var(--pz-color-primary); }
  .pz-footer-link:focus-visible {
    outline: 2px solid var(--pz-color-primary);
    outline-offset: 2px;
  }

  /* === Sidebar styles (flex child, not fixed) === */
  .pz-sidebar-wrapper {
    position: relative;
    width: 240px;
    flex-shrink: 0;
    z-index: 40;
    transition: width 0.2s ease;
    display: flex;
    flex-direction: column;
  }
  .pz-sidebar-wrapper[data-collapsed="true"] {
    width: 36px;
  }
  .pz-sidebar {
    background-color: var(--pz-color-bg);
    border-right: 1px solid var(--pz-color-border);
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0.75rem 0.5rem;
    transition: opacity 0.15s ease;
  }
  .pz-sidebar-wrapper[data-collapsed="true"] .pz-sidebar {
    opacity: 0;
    pointer-events: none;
  }
  .pz-sidebar-toggle {
    position: absolute;
    right: -12px;
    top: 20px;
    width: 24px;
    height: 24px;
    border-radius: var(--pz-radius-full);
    background-color: var(--pz-color-bg);
    border: 1px solid var(--pz-color-border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--pz-color-text-secondary);
    transition: all 0.15s ease;
    z-index: 45;
  }
  .pz-sidebar-toggle:hover {
    color: var(--pz-color-primary);
    border-color: var(--pz-color-primary-border);
  }
  .pz-sidebar-toggle svg {
    transition: transform 0.2s ease;
  }
  .pz-sidebar-wrapper[data-collapsed="true"] .pz-sidebar-toggle svg {
    transform: rotate(180deg);
  }

  /* === Accordion menu styles === */
  .pz-sidebar-section {
    margin-bottom: 0.25rem;
  }
  .pz-sidebar-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--pz-font-sans);
    font-size: var(--pz-text-sm);
    font-weight: var(--pz-weight-semibold);
    color: var(--pz-color-text-primary);
    padding: 0.5rem 0.75rem;
    border-radius: var(--pz-radius-md);
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s ease;
  }
  .pz-sidebar-title:hover {
    background-color: var(--pz-color-bg-secondary);
  }
  .pz-sidebar-title .pz-chevron {
    margin-left: auto;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .pz-sidebar-section[data-expanded="false"] .pz-chevron {
    transform: rotate(-90deg);
  }
  .pz-sidebar-children {
    overflow: hidden;
    max-height: 500px;
    transition: max-height 0.25s ease;
  }
  .pz-sidebar-section[data-expanded="false"] .pz-sidebar-children {
    max-height: 0;
  }
  .pz-sidebar-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: var(--pz-font-sans);
    font-size: var(--pz-text-sm);
    font-weight: var(--pz-weight-normal);
    color: var(--pz-color-text-secondary);
    padding: 0.375rem 0.75rem 0.375rem 2rem;
    border-radius: var(--pz-radius-md);
    transition: color 0.15s ease, background-color 0.15s ease;
    text-decoration: none;
    white-space: nowrap;
  }
  .pz-sidebar-link:hover {
    color: var(--pz-color-text-primary);
    background-color: var(--pz-color-bg-secondary);
  }
  .pz-sidebar-link:focus-visible {
    outline: 2px solid var(--pz-color-primary);
    outline-offset: 2px;
  }
  .pz-sidebar-link[data-active="true"] {
    color: var(--pz-color-primary);
    background-color: var(--pz-color-primary-light);
    font-weight: var(--pz-weight-medium);
  }

  /* === Main content area: scrollable, flex child next to sidebar === */
  .pz-main-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .pz-main-content {
    flex: 1;
    padding: 1.5rem 2rem;
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .pz-nav-link, .pz-footer-link, .pz-sidebar-link,
    .pz-sidebar-wrapper, .pz-main-area,
    .pz-sidebar-children, .pz-sidebar-title .pz-chevron {
      transition: none;
    }
  }
</style>

<!-- ==================== SIDEBAR TOGGLE + ACCORDION SCRIPT ==================== -->
<script>
  (function() {
    var wrapper = document.getElementById('pz-sidebar-wrapper');
    var toggle = document.getElementById('pz-sidebar-toggle');
    if (!wrapper || !toggle) return;

    // Sidebar collapse/expand
    function toggleSidebar() {
      var collapsed = wrapper.getAttribute('data-collapsed') === 'true';
      wrapper.setAttribute('data-collapsed', collapsed ? 'false' : 'true');
    }
    toggle.addEventListener('click', toggleSidebar);
    toggle.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSidebar(); }
    });

    // Accordion: click title to toggle section, only one open at a time
    var titles = document.querySelectorAll('.pz-sidebar-title[data-toggle]');
    titles.forEach(function(title) {
      title.addEventListener('click', function() {
        var sectionId = title.getAttribute('data-toggle');
        var section = document.querySelector('.pz-sidebar-section[data-section-id="' + sectionId + '"]');
        if (!section) return;
        var isExpanded = section.getAttribute('data-expanded') === 'true';

        // Close all sections
        document.querySelectorAll('.pz-sidebar-section').forEach(function(s) {
          s.setAttribute('data-expanded', 'false');
        });

        // If this section was closed, open it
        if (!isExpanded) {
          section.setAttribute('data-expanded', 'true');
        }
      });
      title.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); title.click(); }
      });
    });
  })();
</script>
