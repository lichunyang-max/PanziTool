# ============================================================================
# PanziPool nginx 反向代理配置
# ----------------------------------------------------------------------------
# 功能概述：
#   1. 裸域 panzipool.com → 301 → www.panzipool.com
#   2. HTTP 80 端口 → 301 → HTTPS 443（强制 HTTPS）
#   3. trailing slash 统一：有尾斜杠的 URL → 301 → 无尾斜杠（根路径 / 除外）
#   4. /api/v1/ → 反代后端 java-api:8080（Spring Boot context-path=/api/v1）
#   5. 其余路径 → 反代前端 nuxt:3000（Nuxt3 SSR）
#   6. 安全响应头 + gzip 压缩 + SSL 优化
# ============================================================================

# 工作进程数（auto 自动匹配 CPU 核心数）
worker_processes auto;

# PID 文件路径
pid /var/run/nginx.pid;

# 事件模块配置
events {
    worker_connections 1024;
}

http {
    # ========================================================================
    # 基础配置
    # ========================================================================

    # MIME 类型映射
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式（记录反向代理所需的 X-Forwarded-For 等信息）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # 文件传输优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;  # 隐藏 nginx 版本号，避免暴露漏洞信息

    # ========================================================================
    # gzip 压缩配置
    # ========================================================================
    gzip on;
    gzip_vary on;             # 响应头添加 Vary: Accept-Encoding
    gzip_proxied any;         # 对所有代理请求启用压缩
    gzip_comp_level 6;        # 压缩级别（1-9，6 为平衡值）
    gzip_min_length 256;      # 仅压缩大于 256 字节的响应
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/xhtml+xml
        application/x-javascript
        application/x-font-ttf
        application/vnd.ms-fontobject
        image/svg+xml
        font/woff
        font/woff2;

    # ========================================================================
    # 上游服务定义（Docker 自定义网络 panzipool-net 内的容器）
    # ========================================================================

    # Nuxt3 前端 SSR 服务
    upstream nuxt_upstream {
        server nuxt:3000;
    }

    # Spring Boot 后端 API 服务
    upstream java_api_upstream {
        server java-api:8080;
    }

    # ========================================================================
    # HTTP 80 端口：强制跳转 HTTPS
    # 所有 HTTP 请求直接 301 到 HTTPS www 域名（合并跳转，减少重定向次数）
    # ========================================================================
    server {
        listen 80;
        server_name panzipool.com www.panzipool.com;

        return 301 https://www.panzipool.com$request_uri;
    }

    # ========================================================================
    # HTTPS 443 端口：裸域 panzipool.com → 301 → www.panzipool.com
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name panzipool.com;

        # SSL 证书路径（通过 docker volume 挂载 ./nginx/certs → /etc/nginx/certs）
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # 裸域 301 跳转到 www
        return 301 https://www.panzipool.com$request_uri;
    }

    # ========================================================================
    # HTTPS 443 端口：主站 www.panzipool.com（核心反代配置）
    # ========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.panzipool.com;

        # SSL 证书路径（通过 docker volume 挂载）
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ====================================================================
        # 安全响应头（always 确保所有响应都携带，包括错误响应）
        # ====================================================================
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ====================================================================
        # trailing slash 统一：有尾斜杠的 URL → 301 → 无尾斜杠
        # 正则 ^/(.*)/$ 匹配以 / 结尾的路径（根路径 / 不匹配，因 .* 需至少有内容后再接 /）
        # rewrite permanent 发送 301 永久重定向，自动保留原始查询参数
        # 放在 server 级别，优先于 location 匹配执行
        # ====================================================================
        rewrite ^/(.*)/$ /$1 permanent;

        # ====================================================================
        # 后端 API 反代：/api/v1/ → java-api:8080
        # 后端 Spring Boot context-path=/api/v1，完整路径透传
        # ====================================================================
        location /api/v1/ {
            proxy_pass http://java_api_upstream;

            # 传递客户端真实信息（后端需要获取真实 IP）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 代理超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ====================================================================
        # 前端反代：其余所有路径 → nuxt:3000
        # ====================================================================
        location / {
            proxy_pass http://nuxt_upstream;

            # 传递客户端真实信息
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（Nuxt3 HMR，生产环境一般不需要但保留兼容性）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 代理超时设置
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
